<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Nijoo" />
  <meta name="theme-color" content="#0a0a0b" />
  <link rel="stylesheet" href="styles.css" />
  <title>Copy All URLs</title>
</head>

<body>
  <div class="aurora" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <span class="grain"></span>
  </div>

  <main class="app">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="9" y="9" width="11" height="11" rx="2.5"></rect>
            <path d="M5.5 15H4.8A2.8 2.8 0 0 1 2 12.2V4.8A2.8 2.8 0 0 1 4.8 2h7.4A2.8 2.8 0 0 1 15 4.8v.7"></path>
          </svg>
        </div>
        <div class="brand-copy">
          <h1><span class="brand-word">Copy All</span><span class="brand-accent">URLs<span
                class="brand-dot">.</span></span></h1>
          <p>Every tab. One clipboard.</p>
        </div>
      </div>
      <div class="tab-badge" title="Open tabs">
        <span class="tab-badge-dot" aria-hidden="true"></span>
        <span class="tab-badge-label">Tabs</span>
        <span id="tabCount">0</span>
      </div>
    </header>

    <div class="app-meta" aria-hidden="true">
      <span class="app-meta-item"><i class="meta-led"></i> Session &mdash; 001</span>
      <span class="app-meta-item">Tabs <span class="meta-arrow">&rarr;</span> Clipboard</span>
      <span class="app-meta-item app-meta-item--end">Local only</span>
    </div>

    <section class="toolbar">
      <div class="search-field" id="searchField">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5"></circle>
          <path d="m16 16 4.5 4.5"></path>
        </svg>
        <input id="searchInput" type="search" placeholder="Search title or URL" autocomplete="off" spellcheck="false"
          aria-label="Search tabs" />
        <button id="clearSearch" class="icon-btn clear-btn" type="button" aria-label="Clear search" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
            aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18"></path>
          </svg>
        </button>
        <kbd class="kbd" aria-hidden="true">/</kbd>
      </div>

      <div class="format-switch" id="formatSwitch" role="radiogroup" aria-label="Copy format" style="--i: 0">
        <span class="format-indicator" aria-hidden="true"></span>
        <button type="button" class="format-option is-active" data-format="urls" role="radio" aria-checked="true"
          title="One plain URL per line">
          URLs
        </button>
        <button type="button" class="format-option" data-format="titled" role="radio" aria-checked="false"
          title="Page title followed by its URL">
          Title + URL
        </button>
        <button type="button" class="format-option" data-format="markdown" role="radio" aria-checked="false"
          title="Markdown list of links">
          Markdown
        </button>
      </div>
    </section>

    <div class="list-head">
      <span id="listMeta" class="list-meta" aria-live="polite">Loading tabs&hellip;</span>
      <button id="selectAllBtn" class="text-btn" type="button">Select all</button>
    </div>

    <ul id="urlList" class="tab-list" aria-label="Open tabs">
      <li class="skeleton" aria-hidden="true">
        <span class="skeleton-check"></span>
        <span class="skeleton-favicon"></span>
        <span class="skeleton-lines">
          <span class="skeleton-line skeleton-line-title"></span>
          <span class="skeleton-line skeleton-line-url"></span>
        </span>
      </li>
      <li class="skeleton" aria-hidden="true">
        <span class="skeleton-check"></span>
        <span class="skeleton-favicon"></span>
        <span class="skeleton-lines">
          <span class="skeleton-line skeleton-line-title"></span>
          <span class="skeleton-line skeleton-line-url"></span>
        </span>
      </li>
      <li class="skeleton" aria-hidden="true">
        <span class="skeleton-check"></span>
        <span class="skeleton-favicon"></span>
        <span class="skeleton-lines">
          <span class="skeleton-line skeleton-line-title"></span>
          <span class="skeleton-line skeleton-line-url"></span>
        </span>
      </li>
    </ul>

    <div id="emptyState" class="empty-state" hidden>
      <div class="empty-glow" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="11" cy="11" r="6.5"></circle>
          <path d="m16 16 4.5 4.5"></path>
          <path d="M8.5 11h5"></path>
        </svg>
      </div>
      <p id="emptyTitle" class="empty-title">No tabs found</p>
      <p id="emptyHint" class="empty-hint">Try a different search term.</p>
    </div>

    <footer class="actions">
      <button id="copyBtn" class="btn btn-primary" type="button">
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="9" y="9" width="11" height="11" rx="2.5"></rect>
            <path d="M5.5 15H4.8A2.8 2.8 0 0 1 2 12.2V4.8A2.8 2.8 0 0 1 4.8 2h7.4A2.8 2.8 0 0 1 15 4.8v.7"></path>
          </svg>
        </span>
        <span id="copyLabel" class="btn-label">Copy URLs</span>
        <kbd class="kbd kbd-on-primary" aria-hidden="true">&#9166;</kbd>
      </button>
      <button id="pasteOpenBtn" class="btn btn-ghost" type="button"
        title="Read links from your clipboard and open them as new tabs">
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="8" y="2.5" width="8" height="4" rx="1.6"></rect>
            <path d="M16 4.5h1.8A2.2 2.2 0 0 1 20 6.7v12.1a2.2 2.2 0 0 1-2.2 2.2H6.2A2.2 2.2 0 0 1 4 18.8V6.7a2.2 2.2 0 0 1 2.2-2.2H8"></path>
            <path d="M12 11v6"></path>
            <path d="m9.5 14.5 2.5 2.5 2.5-2.5"></path>
          </svg>
        </span>
        <span class="btn-label">Paste &amp; open</span>
      </button>
    </footer>

    <footer class="support">
      <div class="support-card">
        <a class="support-avatar" href="https://github.com/rockz5555" target="_blank" rel="noopener noreferrer"
          title="Nijoo on GitHub" aria-label="Nijoo on GitHub">
          <span class="support-avatar-ring" aria-hidden="true"></span>
          <span class="support-avatar-face" aria-hidden="true">N<img class="support-avatar-img" alt=""
              decoding="async" referrerpolicy="no-referrer"></span>
          <i class="support-avatar-status" aria-hidden="true"></i>
        </a>
        <div class="support-info">
          <div class="support-name-row">
            <span class="support-name">Nijoo</span>
            <span class="support-tag">Author</span>
          </div>
          <a class="support-repo" href="https://github.com/rockz5555/CopyAllTabUrls" target="_blank"
            rel="noopener noreferrer" title="View CopyAllTabUrls on GitHub">
            <svg class="support-github" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path
                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
            </svg>
            <span class="support-repo-name">CopyAllTabUrls</span>
            <svg class="support-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 17 17 7M9 7h8v8"></path>
            </svg>
          </a>
        </div>
        <a class="support-donate" href="https://www.paypal.me/nizwer" target="_blank" rel="noopener noreferrer"
          title="Support this project via PayPal">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M7.076 21.337H2.47a.641.641 0 0 1-.633-.74L4.944.901C5.026.382 5.474 0 5.998 0h7.46c2.57 0 4.578.543 5.69 1.81 1.01 1.15 1.304 2.42 1.012 4.287-.023.143-.047.288-.077.437-.983 5.05-4.349 6.797-8.647 6.797h-2.19c-.524 0-.968.382-1.05.9l-1.12 7.106zm14.146-14.42a3.35 3.35 0 0 0-.607-.541c-.013.076-.026.175-.041.254-.93 4.778-4.005 7.201-9.138 7.201h-2.19a.563.563 0 0 0-.556.479l-1.187 7.527h-.506l-.24 1.516a.56.56 0 0 0 .554.647h3.882c.46 0 .85-.334.922-.788.06-.26.76-4.852.816-5.09a.932.932 0 0 1 .923-.788h.58c3.76 0 6.705-1.528 7.565-5.946.36-1.847.174-3.388-.777-4.471z" />
          </svg>
          <span>Donate</span>
        </a>
      </div>
      <p class="support-signature">
        Made with
        <span class="support-heart" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 21s-6.7-4.35-9.33-8.09C.9 9.94 2.07 6.5 5.2 5.5c1.9-.6 3.9.06 5.1 1.6L12 8.6l1.7-1.5c1.2-1.54 3.2-2.2 5.1-1.6 3.13 1 4.3 4.44 2.53 7.41C18.7 16.65 12 21 12 21z" />
          </svg>
        </span>
        for tab hoarders
      </p>
    </footer>
  </main>

  <div id="toastContainer" class="toast-container" role="status" aria-live="polite"></div>

  <script src="popup.js" type="module"></script>
</body>

</html>
