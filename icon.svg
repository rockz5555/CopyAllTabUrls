<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Copy All URLs">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b0a14"/>
      <stop offset="0.55" stop-color="#14060c"/>
      <stop offset="1" stop-color="#080306"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb066"/>
      <stop offset="0.45" stop-color="#ff2d55"/>
      <stop offset="1" stop-color="#ff0080"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffb066"/>
      <stop offset="0.38" stop-color="#ff4d6d"/>
      <stop offset="1" stop-color="#ff0080"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2d55" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff2d55" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- frosted dark tile -->
  <rect x="3" y="3" width="122" height="122" rx="30" fill="url(#tile)"/>
  <rect x="3.75" y="3.75" width="120.5" height="120.5" rx="29.25" fill="none"
    stroke="#ff96a5" stroke-opacity="0.24" stroke-width="1.5"/>
  <path d="M12 34c0-12 8-20 22-22" fill="none" stroke="#ffffff" stroke-opacity="0.10"
    stroke-width="2" stroke-linecap="round"/>

  <!-- ambient neon bloom -->
  <circle cx="58" cy="66" r="48" fill="url(#glow)" filter="url(#soft)"/>

  <!-- copy glyph: back card -->
  <rect x="52" y="26" width="46" height="46" rx="13" fill="none"
    stroke="url(#neon)" stroke-opacity="0.7" stroke-width="9"/>

  <!-- copy glyph: front card -->
  <rect x="26" y="52" width="48" height="48" rx="14" fill="url(#front)"/>
  <path d="M36 62h14" fill="none" stroke="#ffffff" stroke-opacity="0.55"
    stroke-width="3" stroke-linecap="round"/>
  <rect x="26" y="52" width="48" height="48" rx="14" fill="none"
    stroke="#ffffff" stroke-opacity="0.38" stroke-width="2"/>
</svg>
